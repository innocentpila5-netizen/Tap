<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TapPoints - Offline</title>
  <meta name="theme-color" content="#000000">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #059669, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px;
      font-weight: 800;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      max-width: 300px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: #10b981;
      color: #000000;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>You are currently offline</h1>
  <p>Please check your internet connection and tap retry to continue earning points.</p>
  <button onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
