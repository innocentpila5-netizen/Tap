name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Verify Gradle Wrapper JAR
        run: |
          if [ ! -s android/gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Repairing corrupted gradle-wrapper.jar..."
            curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x android/gradlew

      - name: Build Android APK & AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Upload Debug APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: TapPoints-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug AAB (For Google Play Store Console)
        uses: actions/upload-artifact@v4
        with:
          name: TapPoints-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: warn
          retention-days: 30
