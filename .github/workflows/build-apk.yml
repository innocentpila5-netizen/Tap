name: Build Native Android APK and AAB (Capacitor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android

      - name: Build Android APK & AAB with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace

      - name: Upload Debug APK (For Direct Phone Installation)
        uses: actions/upload-artifact@v4
        with:
          name: TapPoints-APK
          path: android/app/build/outputs/apk/debug/
          retention-days: 30

      - name: Upload Debug AAB (For Google Play Store Console)
        uses: actions/upload-artifact@v4
        with:
          name: TapPoints-AAB
          path: android/app/build/outputs/bundle/debug/
          retention-days: 30

