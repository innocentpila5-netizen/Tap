<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="8" stroke-dasharray="16 12" opacity="0.4"/>
  
  <!-- Main Coin Disc -->
  <circle cx="256" cy="256" r="140" fill="url(#coinGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#fbbf24" stroke-width="6"/>
  
  <!-- Lightning Zap Icon -->
  <path d="M266 160 L200 270 L248 270 L236 352 L312 242 L264 242 Z" fill="#020617" />
  <path d="M272 168 L212 268 L254 268 L244 340 L304 248 L268 248 Z" fill="#ffffff" />
</svg>
